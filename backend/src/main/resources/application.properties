spring.application.name=backend

# --- Database: PostgreSQL -------------------------------------------------
# Credentials are provided via environment variables and never hard-coded.
# Defaults point at a local development database; override per environment.
spring.datasource.url=${BARBERING_DB_URL:jdbc:postgresql://localhost:5432/barbering}
spring.datasource.username=${BARBERING_DB_USER:barbering}
spring.datasource.password=${BARBERING_DB_PASSWORD:}

# Schema is owned by Flyway migrations (source of truth); Hibernate only
# validates the mapping at startup and never auto-creates or updates DDL.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Local development adapter for barber images. Replace only the storage
# implementation when object storage is configured; clients receive opaque IDs.
barbering.upload-dir=${BARBERING_UPLOAD_DIR:./uploads/barber-photos}
barbering.frontend-origin=${BARBERING_FRONTEND_ORIGIN:http://localhost:3000}

# --- Google Places (New) provider ------------------------------------------
# Server-side only. Leave the key empty to run with an honest "unavailable"
# state; nearby discovery then falls back to database listings only.
barbering.google.places.api-key=${BARBERING_GOOGLE_PLACES_API_KEY:}
barbering.google.places.base-url=${BARBERING_GOOGLE_PLACES_BASE_URL:https://places.googleapis.com}
barbering.google.places.timeout-seconds=${BARBERING_GOOGLE_PLACES_TIMEOUT_SECONDS:10}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${BARBERING_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${BARBERING_COOKIE_SAMESITE:lax}

server.port=${PORT:8080}
