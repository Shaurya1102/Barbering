# Automated tests run against in-memory H2 in PostgreSQL compatibility mode,
# so no running database is required. Migrations are the same portable SQL
# used by production PostgreSQL (see src/main/resources/db/migration).
spring.datasource.url=jdbc:h2:mem:barbering;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
